<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly reading picks{% endblock %} | {{ firm_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('submit_form') }}">{{ firm_name }}<span>Weekly reading picks</span></a>
      {% if is_admin %}
      <nav class="nav">
        <a href="{{ url_for('admin') }}">Dashboard</a>
        <a href="{{ url_for('settings_page') }}">Settings</a>
        <form method="post" action="{{ url_for('logout') }}"><button class="linklike">Sign out</button></form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="wrap {% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flashes" role="status">
        {% for category, message in messages %}<p class="flash flash-{{ category }}">{{ message }}</p>{% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
